<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Task</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header class="d-flex justify-content-center py-3">
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="/tasks" class="nav-link" aria-current="page">Tasks</a></li>
            <li class="nav-item"><a href="/add-task" class="nav-link active">Add Task</a></li>
            <li class="nav-item"><a href="/logout" class="nav-link">Log out</a></li>
        </ul>
    </header>
    <main class="form-signin w-50 m-auto">
        <form action="/register-task" method="post">
            <h1 class="h3 mb-3 fw-normal">Add Task</h1>

            <div class="form-floating">
                <input name="name" class="form-control" id="floatingInput" placeholder="Title: ">
                <label for="floatingInput">Title</label>
            </div>
            <div class="form-floating">
                <input name="description" class="form-control mt-3" id="floatingPassword" placeholder="Description: ">
                <label for="floatingPassword">Description</label>
            </div>
            <button class="btn btn-primary w-100 py-2 my-3" type="submit">Add</button>
        </form>
    </main>
</body>
</html>
