<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasks page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header class="d-flex justify-content-center py-3">
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="/tasks" class="nav-link active" aria-current="page">Tasks</a></li>
            <li class="nav-item"><a href="/add-task" class="nav-link">Add Task</a></li>
            <li class="nav-item"><a href="/logout" class="nav-link">Log out</a></li>
        </ul>
    </header>

    <div class="alert alert-info w-50 m-lg-5 mb-1 mt-0" th:each="task : ${tasks}">
        <h3 th:text="|Name: ${task.getName()}|"></h3>
        <p th:text="|Description: ${task.getDescription()}|"></p>
        <form th:action="|/remove-task/${task.getId()}|" method="post">
            <button type="submit" class="btn btn-success">Complete</button>
        </form>
    </div>
</body>
</html>
